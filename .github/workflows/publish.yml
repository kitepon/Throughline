name: publish

# main へ着地した release commit に v<version> tag を push すると、npm Trusted Publishing（OIDC）で公開する。
# 2FA を飛ばす publish token は npm が廃止するため使わない。npmjs.com 側でこの workflow を信頼済み公開元に登録する。
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    # Trusted Publishing は GitHub-hosted runner だけが対象。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: tag と package version の一致
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      # prepublishOnly が既定ブランチ祖先と全試験を検査する。
      - run: npm publish
